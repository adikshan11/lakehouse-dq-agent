name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests orchestration
      - run: pytest -q
      - name: End-to-end on one month
        run: |
          lakehouse 2024-01
          cd dbt && dbt build --profiles-dir . && cd ..
          python -m lakehouse.agent --offline
          cd dbt && dbt test --profiles-dir .
        env:
          LAKEHOUSE_DATA: ${{ github.workspace }}/data
